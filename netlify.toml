[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
   
[[redirects]]
  from = "/share-img/*"
  to = "/.netlify/functions/share?img=:splat"
  status = 200
  force = true

[[redirects]]
  from = "/share/*"
  to = "/.netlify/functions/share?id=:splat"
  status = 200
  force = true
